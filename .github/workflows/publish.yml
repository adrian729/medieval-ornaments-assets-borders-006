name: Publish approved resources
run-name: Publish borders-006 with ${{ inputs.tooling-ref }} ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      tooling-ref:
        description: Main commit whose resource-lock.json approves this source
        type: string
        required: true
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
      verify-only:
        description: Run every publication check and pack without contacting npm
        type: boolean
        default: false
      nonce:
        description: Identifier the release orchestrator uses to find this run
        type: string
        default: ''
permissions:
  contents: write
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@2b3be3cb8b19b24130a4e4516e01fa922974ffbb
    with:
      source: borders-006
      tooling-ref: ${{ inputs.tooling-ref }}
      check-authentication: ${{ inputs.check-authentication }}
      verify-only: ${{ inputs.verify-only }}
